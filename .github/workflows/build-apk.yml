name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive
        run: tar -xzf car_fault_finder.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate fault data
        working-directory: car_fault_finder
        run: python3 tools/validate_faults.py

      - name: Create Android platform files (first run only)
        working-directory: car_fault_finder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name car_fault_finder .
          fi
          # Remove the default template test (it references MyApp and fails to compile)
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: car_fault_finder
        run: flutter pub get

      - name: Analyze (errors only)
        working-directory: car_fault_finder
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: car_fault_finder
        run: flutter test

      - name: Build release APK
        working-directory: car_fault_finder
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-fault-finder-apk
          path: car_fault_finder/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
